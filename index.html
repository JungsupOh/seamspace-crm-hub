<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seamspace CRM</title>
    <meta name="description" content="Seamspace GTM CRM — 고객·딜·이용권 통합 관리" />
    <meta name="author" content="Seamspace" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Browsers and crawlers request /favicon.ico by convention even when an SVG
         icon is declared, so this file must exist and must be ours. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <meta property="og:title" content="Seamspace CRM" />
    <meta property="og:description" content="Seamspace GTM CRM — 고객·딜·이용권 통합 관리" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seamspace" />
    <meta property="og:url" content="https://seamspace-crm-hub.vercel.app/" />
    <!-- Without og:image, link previews fall back to the favicon. -->
    <meta property="og:image" content="https://seamspace-crm-hub.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seamspace CRM" />
    <meta name="twitter:description" content="Seamspace GTM CRM — 고객·딜·이용권 통합 관리" />
    <meta name="twitter:image" content="https://seamspace-crm-hub.vercel.app/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
